# Local development database. Bound to 127.0.0.1 only; the passwords below are
# development defaults and can be overridden from your shell environment.
name: trustbrick

services:
  postgres:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: trustbrick
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:-postgres_dev_only}
      # Consumed by db/init to create the two application roles.
      TRUSTBRICK_OWNER_PASSWORD: ${TRUSTBRICK_OWNER_PASSWORD:-owner_dev_only}
      TRUSTBRICK_APP_PASSWORD: ${TRUSTBRICK_APP_PASSWORD:-app_dev_only}
    ports:
      # 5432 is commonly taken by other local Postgres instances; override with TRUSTBRICK_DB_PORT.
      - "127.0.0.1:${TRUSTBRICK_DB_PORT:-5434}:5432"
    volumes:
      - trustbrick-pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustbrick"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Joins agents' guided phone photos into 360° panoramas (stitcher/README.md). Opt-in, so
  # `npm run db:up` stays quick: start it with `npm run stitcher:up`.
  stitcher:
    profiles: ["stitcher"]
    build: ./stitcher
    restart: unless-stopped
    ports:
      - "127.0.0.1:${TRUSTBRICK_STITCHER_PORT:-8090}:8090"
    # Joining 30 photos needs most of a gigabyte for a minute or two.
    mem_limit: 2g

volumes:
  trustbrick-pgdata:
